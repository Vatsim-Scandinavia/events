map $http_upgrade $events_connection {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $events_scheme {
    default $scheme;
    https https;
}

map $events_scheme $events_port {
    default 8080;
    https 443;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $events_scheme;
    proxy_set_header X-Forwarded-Port $events_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $events_connection;
    proxy_buffering off;
    proxy_read_timeout 3600s;

    # The font plugin handles requests before Vite removes its base path.
    location /__vite/__laravel_vite_plugin__/fonts/ {
        proxy_pass http://127.0.0.1:5173/__laravel_vite_plugin__/fonts/;
    }

    location /__vite/ {
        proxy_pass http://127.0.0.1:5173;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
