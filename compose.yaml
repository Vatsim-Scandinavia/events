# Runs the hub from the image CI publishes (or builds it here with `docker compose build`).
#
# Put the settings in a .env next to this file, starting from .env.example. For a server set at
# least APP_KEY, APP_URL, APP_ENV, APP_DEBUG=false and the VATSIM Connect client, plus
# SESSION_SECURE_COOKIE=true when APP_ENV isn't production (where it's on by default). SQLite is
# kept at /app/storage/database.sqlite unless DB_DATABASE says otherwise (keep it inside
# /app/storage, the only place that survives new images).
#
# Each start caches the configuration, so `docker compose exec app php artisan …` uses the same
# database. After `php artisan config:clear` in a container, restart it to cache it again.
#
# Everything uploaded, logged or stored in SQLite lives in the "storage" volume, so it survives
# new images. Put a reverse proxy that handles HTTPS in front of port 8080 and list it in
# TRUSTED_PROXIES.

services:
  app:
    image: ghcr.io/vatsim-scandinavia/events:dev
    build: .
    env_file: .env
    ports:
      # Only reachable from this machine, where the reverse proxy runs. If the proxy is elsewhere,
      # bind to the interface it reaches you on, never the open internet: the app speaks plain HTTP.
      - "127.0.0.1:8080:80"
    volumes:
      - storage:/app/storage
    restart: unless-stopped

  # The daily jobs: extending repeating events and refreshing VATSIM details.
  scheduler:
    image: ghcr.io/vatsim-scandinavia/events:dev
    env_file: .env
    environment:
      # The app container migrates; this one only waits for it.
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "schedule:work"]
    user: www-data
    volumes:
      - storage:/app/storage
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  storage:
