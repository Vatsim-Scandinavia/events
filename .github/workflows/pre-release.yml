name: Pre-release

# Releases come from release-please, in CI. This is only for trying a version out on staging:
# pushing a tag such as v2.1.0-rc.1 publishes the image CI already tested for that commit
# under that tag alone (never v2.1, v2 or latest) and marks it as a pre-release on GitHub.
# CI publishes an image for every push to dev, so tag a commit on dev.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Publish the tested image
        env:
          IMAGE: ghcr.io/vatsim-scandinavia/events
          TAG: ${{ github.ref_name }}
        run: |
          if ! docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" > /dev/null; then
            echo "::error::No image for $GITHUB_SHA. Tag a commit on dev whose CI run has finished."
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:sha-$GITHUB_SHA"

      - name: Create the GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --prerelease --verify-tag --generate-notes \
            --title "$TAG" --repo "$GITHUB_REPOSITORY"
