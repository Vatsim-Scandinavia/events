name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# A newer push cancels a pull request's run, but never dev's: its run may be publishing a release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Tests, types and style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          php-extensions: pdo_sqlite

      - name: Check PHP style
        run: vendor/bin/pint --test

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format:check

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: php artisan test --compact

  # The checks above run on SQLite. Servers can run the hub on MySQL or PostgreSQL instead.
  databases:
    name: Tests on ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL
            connection: mysql
            port: 3306
            username: root
            mysql: mysql:8.4.13
            postgres: ''
          - name: PostgreSQL
            connection: pgsql
            port: 5432
            username: postgres
            mysql: ''
            postgres: postgres:18.6

    # Only the matrix entry's own server starts: an empty image skips a service.
    services:
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: testing
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: ''

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          php-extensions: pdo_mysql, pdo_pgsql

      # Pages render the Vite manifest, so the tests need the frontend built.
      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: php artisan test --compact

  image:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: events:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start it as a server would run it and check it migrates, answers and refuses other hosts.
      - name: Smoke test
        run: |
          # No DB_DATABASE, so SQLite has to land in the storage volume by itself.
          docker run -d --name hub \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_ENV=production -e APP_DEBUG=false -e APP_URL=http://hub.test \
            -e DB_CONNECTION=sqlite \
            -e LOG_CHANNEL=stderr \
            -p 8080:80 events:ci

          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' hub)
            [ "$status" = healthy ] && break
            sleep 3
          done
          docker logs hub
          test "$status" = healthy

          curl -fsS -o /dev/null -H 'Host: hub.test' http://127.0.0.1:8080/events
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: attacker.example' http://127.0.0.1:8080/)" = 400

          docker exec hub test -f /app/storage/database.sqlite
          # Dev sign-in stays off outside local development.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: hub.test' http://127.0.0.1:8080/login)" = 404
          # The web server can't change the code, only storage/ and bootstrap/cache.
          docker exec -u www-data hub sh -c 'test ! -w /app/app/Models/User.php && test -w /app/storage'
          # Query strings (VATSIM's sign-in codes) stay out of the access log.
          curl -s -o /dev/null -H 'Host: hub.test' 'http://127.0.0.1:8080/auth/vatsim/callback?code=smoke-secret&state=x'
          if docker logs hub 2>&1 | grep -q smoke-secret; then echo "The access log recorded a query string."; exit 1; fi
          # Uploads are served as inert files, whatever they contain.
          docker exec -u www-data hub sh -c 'echo "<svg xmlns=\"http://www.w3.org/2000/svg\"/>" > /app/storage/app/public/smoke.svg'
          upload_headers=$(curl -fsSI -H 'Host: hub.test' http://127.0.0.1:8080/storage/smoke.svg)
          echo "$upload_headers" | grep -qi "^content-security-policy: default-src 'none'; style-src 'unsafe-inline'; sandbox"
          echo "$upload_headers" | grep -qi '^x-content-type-options: nosniff'
          # In production the session cookie is only sent over HTTPS, without SESSION_SECURE_COOKIE.
          curl -fsSI -H 'Host: hub.test' http://127.0.0.1:8080/events | grep -i '^set-cookie: [a-z_-]*session=' | grep -qi '; secure'

          # A SQLite path outside the storage volume stops the container with a clear message.
          docker run --name bad-path -e APP_KEY="base64:$(openssl rand -base64 32)" -e APP_URL=http://hub.test \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/app/database/elsewhere.sqlite events:ci || true
          docker logs bad-path 2>&1 | grep -q 'Point DB_DATABASE into /app/storage'

      - name: Build the playground image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: playground
          load: true
          tags: events:playground
          cache-from: type=gha

      # It starts from the sample data, with dev sign-in on and published events for guests.
      - name: Smoke test the playground
        run: |
          docker run -d --name playground \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_URL=http://playground.test \
            -e LOG_CHANNEL=stderr \
            -p 8081:80 events:playground

          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' playground)
            [ "$status" = healthy ] && break
            sleep 3
          done
          docker logs playground
          docker inspect --format 'state: {{.State.Status}}, exit code {{.State.ExitCode}}' playground
          test "$status" = healthy

          set -x
          # Saved first: grep -q stops reading at a match, which fails curl under pipefail.
          curl -fsS -o login.html -H 'Host: playground.test' http://127.0.0.1:8081/login
          grep -q 'Hub Admin' login.html
          curl -fsS -o events.html -H 'Host: playground.test' http://127.0.0.1:8081/events
          grep -q 'Copenhagen Fly-in' events.html
          # Debug pages, Boost and the debug bar stay off.
          test "$(docker exec playground php artisan about --only=environment --json | grep -o '"debug_mode":[a-z]*')" = '"debug_mode":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Host: playground.test' http://127.0.0.1:8081/_boost/browser-logs)" = 404

  # Its own job, so pull request builds never hold registry write access.
  publish:
    name: Publish image
    # Only pushes to dev. The release job below gives a release its version tags.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [checks, databases, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only dev and the commit's sha, never latest, which may be what the current production app runs.
      - name: Publish the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vatsim-scandinavia/events:dev
            ghcr.io/vatsim-scandinavia/events:sha-${{ github.sha }}
          cache-from: type=gha

      # The playground, with sample data and dev sign-in, for people to try the hub out.
      - name: Publish the playground image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: playground
          push: true
          tags: ghcr.io/vatsim-scandinavia/events:playground
          cache-from: type=gha

  # Keeps a Release PR open on dev. Merging it lands here: the release is tagged and published
  # on GitHub, the image this run tested is retagged as the version, and master moves to it.
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write

    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: dev

      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.release_created
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.release.outputs.release_created

      # The very image the jobs above tested, never a rebuild, and never latest.
      - name: Publish the image as the version
        if: steps.release.outputs.release_created
        env:
          IMAGE: ghcr.io/vatsim-scandinavia/events
          MAJOR: ${{ steps.release.outputs.major }}
          MINOR: ${{ steps.release.outputs.minor }}
          TAG: ${{ steps.release.outputs.tag_name }}
          # The Release PR's merge, which may be older than this run's commit.
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" -t "$IMAGE:v$MAJOR.$MINOR" -t "$IMAGE:v$MAJOR" \
            "$IMAGE:sha-$RELEASE_SHA"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.release.outputs.release_created
        with:
          fetch-depth: 0

      # Master only ever points at the latest release. Never forced: if someone committed
      # to master directly, this fails and master has to be put back by hand.
      - name: Move master to the release
        if: steps.release.outputs.release_created
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: git push origin "$RELEASE_SHA:refs/heads/master"
