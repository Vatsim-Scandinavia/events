name: Release

# Pushing a version tag publishes that version's image and drafts its GitHub release.
#   v2.0.0       a release: must be on master. Published as :v2.0.0, :v2.0 and :v2.
#   v2.0.0-rc.1  a pre-release, from any branch, e.g. to try on staging. Published as :v2.0.0-rc.1 only.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

jobs:
  tag:
    name: Check the tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Releases come from master
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) echo "$TAG is a pre-release, so it can come from any branch." ;;
            *)
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
                echo "::error::$TAG isn't on master. Tag a release on master, or add a suffix such as -rc.1 for a pre-release."
                exit 1
              fi
              ;;
          esac

  checks:
    name: CI
    needs: tag
    uses: ./.github/workflows/ci.yml
    # CI's own publish job asks for these, though it only ever runs for pushes to dev.
    permissions:
      contents: read
      packages: write

  publish:
    name: Publish ${{ github.ref_name }}
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre-releases only get their own tag, never v2.0 or v2. Never latest either.
      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/vatsim-scandinavia/events
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Publish the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # A draft, so the notes (breaking changes above all) can be written before anyone sees it.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --draft --verify-tag --generate-notes $prerelease \
            --title "$TAG" --repo "$GITHUB_REPOSITORY"
